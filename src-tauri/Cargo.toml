[package]
name = "ahp-desk"
version = "0.2.2"
description = "A desktop app for Agent Host Protocol hosts"
authors = ["Luiz Fernando Softov <lfs@softov.dev>"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ahp_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the staged ahpw's package.json for its version (build.rs).
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# ring, not the default aws-lc-rs, which needs NASM to build on Windows.
russh = { version = "0.61", default-features = false, features = ["ring", "rsa", "flate2"] }
# npm's latest @ahpd/server; rustls on ring for the same reason, its provider installed in updates.rs.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-updater = "2"

# Asks the session bus whether a tray host is there (tray.rs); the plugins already build it.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.9"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
